# Rebuild README.md and the profile graphics weekly (star counts) and on data / generator changes.
# Timeline: drawn by scripts/generate.py. Ecosystem: Mermaid rendered by mmd-viz (npx).
# README: built with mknodes (PEP 723 dependency of the script, installed by uv).
name: Profile graphics
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.toml", "scripts/generate.py"]
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v7
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run scripts/generate.py --fetch
      - name: Commit if changed
        run: |
          git add README.md assets data/stars.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: re-render profile graphics [skip ci]"
          git push
