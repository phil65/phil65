# Re-render the profile graphics weekly (ecosystem star counts) and on data changes.
name: Profile graphics
on:
  schedule: [{cron: "0 6 * * 1"}]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/profile.toml", "scripts/generate.py"]
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Render
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate.py --fetch
      - name: Commit if changed
        run: |
          git add assets data/stars.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: re-render profile graphics [skip ci]"
          git push
