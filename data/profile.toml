# Data for the profile graphics. Edit this file, then run:
#   python3 scripts/generate.py            # render assets/*.svg
#   python3 scripts/generate.py --fetch    # refresh data/stars.json from the GitHub API first
#
# Ecosystem labels may contain {stars:<repo>}, replaced with the count from data/stars.json.

# Timeline: how the focus shifted, as periods with topics (no package names).
# `ui` is the period's stop on the "UI / UX across stacks" rail at the bottom.
# The last period is drawn as the current one.
[timeline]
title = "How my focus moved"
subtitle = "Fourteen years of open source, 2012 → now"
ui_label = "UI / UX across stacks"
footnote = "An approximation based on the repositories I maintain today; many older packages were deleted, archived or renamed."

[[timeline.period]]
years = "2012–2018"
name = "Kodi"
color = "blue"
topics = [
  "C++ core",
  "Python add-on API",
  "templated skin markup",
  "media metadata & web APIs",
  "editor tooling for Kodi devs",
]
ui = "media-center UI, Kodi's default skin"

[[timeline.period]]
years = "2019–2022"
name = "Desktop & data"
color = "green"
topics = [
  "cross-platform desktop UI",
  "data science & dataframes",
  "Python wrappers for C libraries",
]
ui = "Qt desktop apps"

[[timeline.period]]
years = "2023"
name = "Docs"
color = "amber"
topics = [
  "Markdown",
  "static site generation",
  "documentation tooling",
  "templating",
]
ui = "static websites"

[[timeline.period]]
years = "2024"
name = "LLM tooling"
color = "indigo"
topics = [
  "LLM tooling",
  "MCP servers",
  "tool schemas",
  "repository & API clients",
]
ui = "editor extensions, terminal prompts"

[[timeline.period]]
years = "2025"
name = "Agents"
color = "violet"
topics = [
  "agents & orchestration",
  "sandboxed code execution",
  "filesystem abstractions",
  "Rust bindings",
]
ui = "web UIs"

[[timeline.period]]
years = "2026"
name = "Protocols"
color = "cyan"
topics = [
  "agent protocols (ACP)",
  "coding-agent backends",
  "animated SVG & demo videos",
]
ui = "terminal UIs"

[ecosystem]
title = "agentpool and the libraries it is built from"
subtitle = "Dependency groups from agentpool's uv.lock, plus my other Rust bindings"

  [ecosystem.hub]
  name = "agentpool"
  repo = "agentpool"
  tagline = ["Agents of every kind in one YAML file,", "served over ACP · MCP · AG-UI · OpenCode"]
  clients = ["Zed", "Toad", "OpenCode", "acptui"]

  [[ecosystem.group]]
  name = "Protocols & agent backends"
  color = "violet"
  row = "top"
  packages = ["aclientp", "clawd-code-sdk", "codexed", "pyt3client", "llmling-models", "tokonomics"]

  [[ecosystem.group]]
  name = "Tools & execution"
  color = "blue"
  row = "top"
  packages = ["exxec", "docler", "searchly", "evented", "anyvoice"]

  # row = "side": the panel right of the hub
  [[ecosystem.group]]
  name = "Performance: Rust in Python"
  color = "orange"
  row = "side"
  packages = ["ripgrep-rs", "sublime-search", "frizbee-rs", "mermaid-rs"]

  [[ecosystem.group]]
  name = "Prompting & UI"
  color = "amber"
  row = "top"
  packages = ["promptantic", "slashed", "toprompt", "jinjarope", "clinspector"]

  [[ecosystem.group]]
  name = "Foundation"
  color = "green"
  row = "bottom"
  packages = ["anyenv", "upathtools", "schemez", "epregistry", "yamling"]

  [[ecosystem.group]]
  name = "Docs toolchain"
  color = "pink"
  row = "bottom"
  packages = ["mknodes"]
  note = "builds agentpool's docs"
