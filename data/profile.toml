# Data for the profile README and its graphics. Edit this file, then run:
#   uv run scripts/generate.py            # README.md, assets/*.svg, assets/ecosystem.mmd
#   uv run scripts/generate.py --fetch    # refresh data/stars.json from the GitHub API first
#
# Labels may contain {stars:<repo>}, replaced with the count from data/stars.json.

# Timeline: how the focus shifted, as periods with topics (no package names).
# `ui` is the period's stop on the "UI / UX across stacks" rail at the bottom.
# The last period is drawn as the current one.
[timeline]
title = "How my focus moved"
subtitle = "Fourteen years of open source, 2012 → now"
ui_label = "UI / UX across stacks"
footnote = "An approximation based on the repositories I maintain today; many older packages were deleted, archived or renamed."

[[timeline.period]]
years = "2012–2018"
name = "Kodi"
color = "blue"
topics = [
  "C++ core",
  "Python add-on API",
  "templated skin markup",
  "media metadata & web APIs",
  "editor tooling for Kodi devs",
]
ui = "media-center UI, Kodi's default skin"

[[timeline.period]]
years = "2019–2022"
name = "Desktop & data"
color = "green"
topics = [
  "cross-platform desktop UI",
  "data science & dataframes",
  "Python wrappers for C libraries",
]
ui = "Qt desktop apps"

[[timeline.period]]
years = "2023"
name = "Docs"
color = "amber"
topics = [
  "Markdown",
  "static site generation",
  "documentation tooling",
  "templating",
]
ui = "static websites"

[[timeline.period]]
years = "2024"
name = "LLM tooling"
color = "indigo"
topics = [
  "LLM tooling",
  "MCP servers",
  "tool schemas",
  "repository & API clients",
]
ui = "editor extensions, terminal prompts"

[[timeline.period]]
years = "2025"
name = "Agents"
color = "violet"
topics = [
  "agents & orchestration",
  "sandboxed code execution",
  "filesystem abstractions",
  "Rust bindings",
]
ui = "web UIs"

[[timeline.period]]
years = "2026"
name = "Protocols"
color = "cyan"
topics = [
  "agent protocols (ACP)",
  "coding-agent backends",
  "animated SVG & demo videos",
]
ui = "terminal UIs"

# Ecosystem: written as a Mermaid block-beta diagram (assets/ecosystem.mmd), rendered by mmd-viz.
# Blocks fill a grid of `columns` in order; `span` widens a block, `columns` sets its chip grid.
# Colours are mmd-viz accents (cyan, indigo, amber, emerald, pink, rose, violet, blue, orange, teal).
[ecosystem]
title = "agentpool and the libraries it is built from"
footer = "dependency groups from agentpool's uv.lock · plus my other Rust bindings"
alt = "agentpool and the libraries it is built from: clients it serves, Rust bindings, protocols and agent backends, tools and execution, prompting and UI, a shared foundation and the docs toolchain"
mmd_viz = "0.14.0"
columns = 3
edges = [
  ["serves", "hub"],
  ["hub", "perf"],
  ["hub", "proto"],
  ["hub", "tools"],
  ["hub", "prompt"],
  ["proto", "found"],
  ["tools", "found"],
  ["docs", "found"],
]

  [[ecosystem.block]]
  id = "serves"
  name = "Serves"
  color = "cyan"
  packages = ["Zed", "Toad", "OpenCode", "acptui"]

  [[ecosystem.block]]
  id = "hub"
  hub = true
  label = ["agentpool ★{stars:agentpool}", "agents of every kind", "in one YAML file", "ACP · MCP · AG-UI"]

  [[ecosystem.block]]
  id = "perf"
  name = "Performance: Rust in Python"
  color = "orange"
  packages = ["ripgrep-rs", "sublime-search", "frizbee-rs", "mermaid-rs"]

  [[ecosystem.block]]
  id = "proto"
  name = "Protocols & agent backends"
  color = "violet"
  packages = ["aclientp", "clawd-code-sdk", "codexed", "pyt3client", "llmling-models", "tokonomics"]

  [[ecosystem.block]]
  id = "tools"
  name = "Tools & execution"
  color = "blue"
  packages = ["exxec", "docler", "searchly", "evented", "anyvoice"]

  [[ecosystem.block]]
  id = "prompt"
  name = "Prompting & UI"
  color = "amber"
  packages = ["promptantic", "slashed", "toprompt", "jinjarope", "clinspector"]

  [[ecosystem.block]]
  id = "found"
  name = "Foundation"
  color = "emerald"
  span = 2
  columns = 5
  packages = ["anyenv", "upathtools", "schemez", "epregistry", "yamling"]

  [[ecosystem.block]]
  id = "docs"
  name = "Docs toolchain"
  color = "pink"
  columns = 1
  packages = ["mknodes<br/>builds agentpool's docs"]

# README.md, built with mknodes (GitHub flavour).
[readme]
greeting = "Hi, I'm Philipp"
intro = """
I build developer tools in Python, and have done UI/UX on many stacks since 2012:
Kodi (160 merged PRs to its C++ core, plus Python add-ons and templated skin markup), Qt desktop
apps, web, terminal UIs and editor extensions. Today most of it flows into **[agentpool](https://github.com/phil65/agentpool)**,
an experimental hub that connects AI agents over ACP and MCP.
These days my AI agents maintain the whole stack: they plan, delegate tasks to other agents, run
the releases, sweeps, docs and reviews, and I steer.
"""
timeline_alt = "How my focus moved, 2012 to now: Kodi; desktop UI and data science; docs and static sites; LLM tooling; agents; agent protocols. UI / UX across stacks runs through all of it."
footnote = """
The timeline is an approximation based on the repositories I maintain today; many older packages were deleted, archived or renamed.
README built with [mknodes](https://github.com/phil65/mknodes) · ecosystem diagram rendered from Mermaid with [mmd-viz](https://github.com/phil65/mmd-viz) · timeline drawn by [`scripts/generate.py`](scripts/generate.py) · all from [`data/profile.toml`](data/profile.toml).
"""

